[platformio]
default_envs = nucleo_c031c6
src_dir = Src
include_dir = Inc

[env:nucleo_c031c6]
platform = ststm32
board = nucleo_c031c6
framework = stm32cube

build_type = debug

board_build.ldscript = scripts/platformio/STM32C031xx_FLASH_platformio.ld
board_build.stm32cube.custom_config_header = yes
board_build.stm32cube.custom_system_setup = yes

extra_scripts =
    pre:scripts/platformio/clean_arch_build.py
    pre:scripts/platformio/cubemx_build.py

build_flags =
    -I Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM0
    -I Inc
    -D USE_HAL_DRIVER
    -D STM32C031xx
    -Wall
    -Wextra
    -Wshadow
    -Wundef
    -Wformat=2
    -Wno-unused-parameter
    -Wno-missing-field-initializers

    -D USE_NUCLEO_64
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = no

extra_scripts =
    pre:scripts/platformio/native_test_build.py

build_flags =
    -std=c11
    -Wall
    -Wextra
    -Wshadow
    -Wundef
    -Wformat=2
    -Werror

